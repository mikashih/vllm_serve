services:
  vllm:
    image: ${VLLM_IMAGE}
    container_name: vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
    volumes:
      - ./hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - ${MODEL_ID}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${MAX_MODEL_LEN}"
      - --gpu-memory-utilization
      - "${GPU_MEM_UTIL}"
      - --dtype
      - ${DTYPE}
      - --max-num-batched-tokens
      - "131072"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 600s

  embedding-gemma:
    image: ${VLLM_IMAGE}
    container_name: embedding-gemma
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      HF_TOKEN: ${HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
      VLLM_API_KEY: ${VLLM_API_KEY}
    volumes:
      - ./hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - ${EMBED_MODEL_ID}
      - --served-model-name
      - ${EMBED_MODEL_ID}
      - --runner
      - pooling
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --max-model-len
      - "${EMBED_MAX_MODEL_LEN}"
      - --gpu-memory-utilization
      - "${EMBED_GPU_MEM_UTIL}"
      - --dtype
      - ${EMBED_DTYPE}
      - --max-num-batched-tokens
      - "${EMBED_MAX_NUM_BATCHED_TOKENS}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
